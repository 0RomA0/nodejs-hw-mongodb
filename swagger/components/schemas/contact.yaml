type: object
required:
  - _id
  - name
  - phoneNumber
  - contactType
  - userId
  - createdAt
  - updatedAt
properties:
  _id:
    description: "Contact's id"
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: "Contact's"
    type: string
    example: 'Emily Rose'
  phoneNumber:
    description: "Contact's phone number"
    type: string
    example: +380500505555
  email:
    description: "Contact's email"
    type: string
    example: qwe@gmail.com
  isFavourite:
    description: 'Whether the contact is marked as favourite'
    type: boolean
    example: false
  contactType:
    description: 'Type of contact'
    type: string
    enum:
      - work
      - home
      - personal
    example: work
  photo:
    description: "URL of the contact's photo"
    type: string
    example: 'https://res.cloudinary.com/db5qy1yys/image/upload/v1754371174/wsxmzgginj9ztflahdwh.jpg'
  userId:
    description: 'ID of the user who owns the contact'
    type: string
    example: 68885c57cd55267be7cbad35
  createdAt:
    description: 'Date and time when the contact was created'
    type: string
    format: date-time
    example: '2025-08-05T05:19:27.149+00:00'
  updatedAt:
    description: 'Date and time when the contact was last updated'
    type: string
    format: date-time
    example: '2025-08-05T05:19:35.214+00:00'
