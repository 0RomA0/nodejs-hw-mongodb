tags:
  - Contacts
summary: Update a contact by id
operationId: updateContact
description: 'Update fields of an existing contact by ID'
security:
  - bearerAuth: []

parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '65ca67e7ae7f10c88b598384'

requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            example: 'Julya Bly'
          phoneNumber:
            type: string
            example: '+380000000003'
          email:
            type: string
            example: 'july_03@example.com'
          contactType:
            type: string
            enum:
              - work
              - home
              - personal
            example: home
          isFavourite:
            type: boolean
            example: true
          photo:
            type: string
            format: binary

responses:
  '200':
    description: 'Successfully updated contact'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully patched a contact!'
            data:
              $ref: '../../../components/schemas/contact.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
